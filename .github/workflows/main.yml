name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q RemoteHotspotPro.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Add google-services.json
        run: |
          cp google-services.json RemoteHotspotPro/admin/google-services.json
          cp google-services.json RemoteHotspotPro/user/google-services.json

      - name: Build debug APKs
        working-directory: RemoteHotspotPro
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee full_log.txt
          EXIT=${PIPESTATUS[0]}
          echo "=== COMPILE ERRORS ==="
          grep -E "^e: |error:|Unresolved|FAILURE:|What went wrong|Compilation error" full_log.txt || true
          echo "=== END ERRORS ==="
          exit $EXIT

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: RemoteHotspotPro/*/build/outputs/apk/debug/*.apk
