name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q RemoteHotspotPro.zip

      - name: Apply source fixes
        working-directory: RemoteHotspotPro
        run: |
          # Fix 1: BluetoothSocket nullability
          sed -i 's/val sock: BluetoothSocket = cached/val sock = cached ?: return@withLock null/' admin/src/main/java/com/remotehotspot/admin/AdminBt.kt
          # Fix 2: ExtendedFloatingActionButton named params + contentDescription
          sed -i 's/ExtendedFloatingActionButton({ showAdd = true }, icon = { Icon(Icons.Filled.Add, null) }, text = { Text("Add device") })/ExtendedFloatingActionButton(onClick = { showAdd = true }, icon = { Icon(Icons.Filled.Add, contentDescription = null) }, text = { Text("Add device") })/' admin/src/main/java/com/remotehotspot/admin/MainActivity.kt
          # Fix 3: make clickNode suspend
          sed -i 's/private fun clickNode(n: AccessibilityNodeInfo): Boolean {/private suspend fun clickNode(n: AccessibilityNodeInfo): Boolean {/' user/src/main/java/com/remotehotspot/user/HotspotAccessibilityService.kt
          echo "Source fixes applied"
          grep -n "val sock = cached\|ExtendedFloatingActionButton(onClick\|private suspend fun clickNode" admin/src/main/java/com/remotehotspot/admin/*.kt user/src/main/java/com/remotehotspot/user/HotspotAccessibilityService.kt || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Add google-services.json
        run: |
          cp google-services.json RemoteHotspotPro/admin/google-services.json
          cp google-services.json RemoteHotspotPro/user/google-services.json

      - name: Build debug APKs
        working-directory: RemoteHotspotPro
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: RemoteHotspotPro/*/build/outputs/apk/debug/*.apk
