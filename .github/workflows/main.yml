name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q RemoteHotspotPro.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Add google-services.json
        run: |
          cp google-services.json RemoteHotspotPro/admin/google-services.json
          cp google-services.json RemoteHotspotPro/user/google-services.json
          echo "Copied google-services.json to both modules"

      - name: Build debug APKs
        working-directory: RemoteHotspotPro
        run: gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: RemoteHotspotPro/build_log.txt

      - name: Upload APKs if any
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: RemoteHotspotPro/*/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
