name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q RemoteHotspotPro.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Add google-services.json
        working-directory: RemoteHotspotPro
        run: |
          cat > admin/google-services.json << 'EOF'
{
  "project_info": {
    "project_number": "419365380841",
    "firebase_url": "https://hotsport-b45e4-default-rtdb.firebaseio.com",
    "project_id": "hotsport-b45e4",
    "storage_bucket": "hotsport-b45e4.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:419365380841:android:ff3c761f378d0553c24678",
        "android_client_info": {
          "package_name": "com.remotehotspot.admin"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDJyGMdH6T1zrXo5b3tKAv9ml73MoMtBr8"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    },
    {
      "client_info": {
        "mobilesdk_app_id": "1:419365380841:android:3d9dc827bd05cb46c24678",
        "android_client_info": {
          "package_name": "com.remotehotspot.user"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDJyGMdH6T1zrXo5b3tKAv9ml73MoMtBr8"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
