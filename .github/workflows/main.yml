          cp admin/google-services.json user/google-services.json
          echo "google-services.json created successfully"
          cat admin/google-services.json | head -5

      - name: Build debug APKs
        working-directory: RemoteHotspotPro
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: RemoteHotspotPro/*/build/outputs/apk/debug/*.apk
